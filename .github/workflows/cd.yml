name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted  
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Build Docker image
      run: docker build -t app3 .  

    - name: Deploy Docker container
      run: |
        if (docker ps -a --format '{{.Names}}' | Select-String -Pattern 'app3') {
          docker stop app3
          docker rm app3
        }
        docker run -d -p 5000:5000 --name app3 app3
