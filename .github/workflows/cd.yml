name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted  # Assure-toi d'avoir un runner auto-hébergé configuré en local ou sur une machine Linux.
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - name: Build Docker image
      run: docker build -t app3 .  # Assurez-vous de spécifier le bon nom d'image

    - name: Deploy Docker container
      run: |
        if [[ $(docker ps -a --format '{{.Names}}' | grep -w 'app3') ]]; then
          docker stop app3
          docker rm app3
        fi
        docker run -d -p 5000:5000 --name app3 app3
